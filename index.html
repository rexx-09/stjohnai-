<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St John's AI</title>
    <!-- External Libraries for 3D graphics and Markdown rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 25, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-color: #00d2ff;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* 3D Background Canvas */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Main UI Container */
        #ui-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 10;
            pointer-events: none;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: auto;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 0 0 10px var(--primary-color);
            letter-spacing: 2px;
        }

        #settings-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        #settings-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px var(--primary-color);
        }

        /* Chat Interface */
        #chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            scroll-behavior: smooth;
        }

        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.5;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }

        .user-message {
            align-self: flex-end;
            background: rgba(0, 210, 255, 0.2);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 2px;
        }

        .ai-message p { margin: 0 0 10px 0; }
        .ai-message p:last-child { margin: 0; }
        .ai-message code { background: rgba(0,0,0,0.5); padding: 2px 5px; border-radius: 4px; }
        .ai-message pre { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; overflow-x: auto; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Area */
        #input-area {
            padding: 20px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            pointer-events: auto;
        }

        .input-wrapper {
            display: flex;
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 5px;
            backdrop-filter: blur(15px);
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        #user-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            padding: 12px 20px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #send-btn {
            background: var(--primary-color);
            color: black;
            border: none;
            border-radius: 25px;
            padding: 0 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #send-btn:hover {
            box-shadow: 0 0 15px var(--primary-color);
            transform: scale(1.05);
        }

        /* Settings Modal */
        #settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .modal-content h2 { margin-top: 0; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-actions button {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #save-settings { background: var(--primary-color); color: black; }
        #close-settings { background: #444; color: white; }

        .typing-indicator { display: none; color: #888; font-style: italic; font-size: 14px; padding-left: 20px; }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-wrapper">
        <header>
            <h1 id="ai-name-display">St John's AI</h1>
            <button id="settings-btn">⚙️ AI Settings</button>
        </header>

        <div id="chat-container">
            <div class="message ai-message">
                Hello! I am ready. You can configure my API key and rename me using the Settings menu.
            </div>
        </div>
        <div class="typing-indicator" id="typing-indicator">Processing request...</div>

        <div id="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h2>AI Settings</h2>
            
            <div class="form-group">
                <label>AI Name:</label>
                <input type="text" id="ai-name-input" placeholder="e.g., St John's AI">
            </div>

            <div class="form-group">
                <label>Operation Mode:</label>
                <select id="mode-input">
                    <option value="api">Google AI Studio API (Live)</option>
                    <option value="offline">Offline / Local Mode (Basic)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Google AI Studio API Key:</label>
                <input type="password" id="api-key-input" placeholder="AIzaSy...">
            </div>

            <div class="modal-actions">
                <button id="close-settings">Cancel</button>
                <button id="save-settings">Save Configurations</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           1. 3D VISUAL EFFECTS (THREE.JS)
           ========================================= */
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        canvasContainer.appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry(1.5, 64, 64);
        const material = new THREE.PointsMaterial({
            size: 0.015,
            color: 0x00d2ff,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const sphere = new THREE.Points(geometry, material);
        scene.add(sphere);
        camera.position.z = 4;

        let isThinking = false;
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            sphere.rotation.y += 0.002;
            sphere.rotation.x += 0.001;

            if (isThinking) {
                sphere.rotation.y += 0.01;
                sphere.rotation.z += 0.005;
                const scale = 1 + Math.sin(elapsedTime * 10) * 0.15;
                sphere.scale.set(scale, scale, scale);
                material.color.setHex(0xff00cc);
            } else {
                sphere.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                material.color.lerp(new THREE.Color(0x00d2ff), 0.05);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* =========================================
           2. SETTINGS MANAGEMENT
           ========================================= */
        const settings = {
            aiName: localStorage.getItem('aiName') || "St John's AI",
            apiKey: localStorage.getItem('apiKey') || '',
            mode: localStorage.getItem('mode') || 'api'
        };

        const titleDisplay = document.getElementById('ai-name-display');
        const modal = document.getElementById('settings-modal');
        const nameInput = document.getElementById('ai-name-input');
        const keyInput = document.getElementById('api-key-input');
        const modeInput = document.getElementById('mode-input');

        function applySettings() {
            titleDisplay.innerText = settings.aiName;
            nameInput.value = settings.aiName;
            keyInput.value = settings.apiKey;
            modeInput.value = settings.mode;
        }
        applySettings();

        document.getElementById('settings-btn').addEventListener('click', () => modal.style.display = 'flex');
        document.getElementById('close-settings').addEventListener('click', () => modal.style.display = 'none');
        
        document.getElementById('save-settings').addEventListener('click', () => {
            settings.aiName = nameInput.value || "St John's AI";
            settings.apiKey = keyInput.value.trim();
            settings.mode = modeInput.value;

            localStorage.setItem('aiName', settings.aiName);
            localStorage.setItem('apiKey', settings.apiKey);
            localStorage.setItem('mode', settings.mode);

            applySettings();
            modal.style.display = 'none';
        });

        /* =========================================
           3. CHAT ENGINE & RESPONSE HANDLING
           ========================================= */
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.classList.add('message');
            if (sender === 'user') {
                div.classList.add('user-message');
                div.innerText = text;
            } else {
                div.classList.add('ai-message');
                div.innerHTML = marked.parse(text);
            }
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleSend() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';
            
            isThinking = true;
            typingIndicator.style.display = 'block';

            let aiResponseText = "";

            try {
                if (settings.mode === 'api' && settings.apiKey) {
                    aiResponseText = await generateFromGoogleAPI(message);
                } else if (settings.mode === 'api' && !settings.apiKey) {
                    aiResponseText = "**System Error:** Please enter your Google AI Studio API Key in the Settings menu.";
                } else {
                    await new Promise(resolve => setTimeout(resolve, 800));
                    aiResponseText = generateOfflineFallback(message);
                }
            } catch (error) {
                console.error(error);
                aiResponseText = `**System Error:** Communication failed. \n\n*Details: ${error.message}*`;
            }

            isThinking = false;
            typingIndicator.style.display = 'none';
            appendMessage('ai', aiResponseText);
        }

        /* =========================================
           4. GOOGLE API CONNECTION (V1 STABLE)
           ========================================= */
        async function generateFromGoogleAPI(prompt) {
            // Using the strictly stable v1 endpoint and ONLY the flash model. No fallbacks to cause errors.
            const endpoint = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${settings.apiKey}`;
            
            const systemPrompt = `You are ${settings.aiName}. If anyone asks who made you, created you, or built you, you must state that you were made by Rehan and his group.`;

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemPrompt }] },
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            if (!response.ok) {
                const err = await response.json();
                console.error("API Error Details:", err);
                throw new Error(err.error?.message || "Failed to connect to Google AI Studio.");
            }

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        // Offline logic for basic responses if needed
        function generateOfflineFallback(prompt) {
            const lower = prompt.toLowerCase();
            const name = settings.aiName;

            if (lower.includes("who made you") || lower.includes("who created you") || lower.includes("built you")) {
                return `I was created by **Rehan and his group**.`;
            }
            if (lower.includes("hello") || lower.includes("hi")) {
                return `Hello! I am **${name}**, currently operating in *Offline Mode*. Switch to API mode in settings for full answers.`;
            }
            
            return `I hear you saying: "${prompt}". \n\n*(Note: Running in Offline Mode. Switch to API mode in AI Settings for full answers!)*`;
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
