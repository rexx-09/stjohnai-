<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-color: #00d2ff;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            margin: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            height: 80vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        #ai-name {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        #settings-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--primary-color);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: var(--glass-bg);
            border: 1px solid var(--glass-border);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        #input-area {
            display: flex;
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            gap: 10px;
        }

        #user-input {
            flex: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-color);
            outline: none;
        }

        #send-btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Settings Modal */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 400px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 14px;
            color: #aaa;
        }

        .form-group input {
            background: #2a2a2a;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px;
            color: var(--text-color);
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-save {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel {
            background: none;
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
    <!-- Three.js for 3D backgrounds -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="app-container">
        <header>
            <div id="ai-name">AI Assistant</div>
            <button id="settings-btn">⚙️ Settings</button>
        </header>
        
        <div id="chat-container">
            <div class="message ai-message">Hello! Please click the gear icon to configure my API key and name in the settings so we can chat.</div>
        </div>
        
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="form-group">
                <label>AI Name:</label>
                <input type="text" id="ai-name-input" placeholder="AI Assistant">
            </div>
            <div class="form-group">
                <label>Google AI Studio API Key:</label>
                <input type="password" id="api-key-input" placeholder="Enter your API Key">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancel-btn">Cancel</button>
                <button class="btn-save" id="save-btn">Save Configurations</button>
            </div>
        </div>
    </div>

    <script>
        // State management
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let aiName = localStorage.getItem('gemini_ai_name') || 'AI Assistant';

        // DOM elements
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const apiKeyInput = document.getElementById('api-key-input');
        const aiNameInput = document.getElementById('ai-name-input');
        const displayedAiName = document.getElementById('ai-name');

        // Apply initial settings
        displayedAiName.innerText = aiName;
        aiNameInput.value = aiName;
        apiKeyInput.value = apiKey;

        // Settings modal logic
        settingsBtn.addEventListener('click', () => settingsModal.style.display = 'flex');
        cancelBtn.addEventListener('click', () => settingsModal.style.display = 'none');
        
        saveBtn.addEventListener('click', () => {
            apiKey = apiKeyInput.value.trim();
            aiName = aiNameInput.value.trim() || 'AI Assistant';
            
            localStorage.setItem('gemini_api_key', apiKey);
            localStorage.setItem('gemini_ai_name', aiName);
            
            displayedAiName.innerText = aiName;
            settingsModal.style.display = 'none';
        });

        // Chat logic
        function appendMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleSend() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            if (!apiKey) {
                appendMessage('ai', 'System: API Key is missing. Please configure your API key in the settings first.');
                return;
            }

            try {
                // Using the v1beta endpoint with gemini-1.5-flash as discussed
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: message }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage('ai', reply);
                } else if (data.error) {
                    console.error("API Error:", data.error);
                    appendMessage('ai', `System Error: ${data.error.message}`);
                } else {
                    appendMessage('ai', 'System Error: Could not generate a response.');
                }
            } catch (error) {
                console.error(error);
                appendMessage('ai', 'System Error: Communication failed. Please check your internet connection or API Key.');
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // 3D Background Logic (Three.js)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Create particles for a cool tech aesthetic
        const geometry = new THREE.BufferGeometry();
        const count = 1000;
        const positions = new Float32Array(count * 3);

        for(let i = 0; i < count * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 10;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ 
            size: 0.02, 
            color: 0x00d2ff, 
            transparent: true, 
            opacity: 0.6 
        });
        
        const points = new THREE.Points(geometry, material);
        scene.add(points);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            points.rotation.y += 0.001;
            points.rotation.x += 0.0005;
            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing to keep the 3D canvas looking right
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
